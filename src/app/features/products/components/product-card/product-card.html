<a
  [routerLink]="['/products', product().id]"
  class="group flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200/60
         transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:ring-brand-secondary/20"
>
  <!-- Image -->
  <div class="aspect-[4/3] w-full overflow-hidden bg-gradient-to-br from-brand-cream to-slate-100">
    <img
      [src]="product().imageUrl || 'https://placehold.co/600x400/F8F1E4/B8863C?text=Rema+Baby'"
      [alt]="product().name"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
      loading="lazy"
    />
  </div>

  <!-- Contenu -->
  <div class="flex flex-1 flex-col gap-2 p-4">
    <!-- En-tête : nom + statut -->
    <div class="flex items-start justify-between gap-2">
      <h3 class="line-clamp-2 text-sm font-semibold text-brand-primary">{{ product().name }}</h3>
      <app-status-badge [status]="product().status" />
    </div>

    <!-- Catégorie -->
    <p class="text-xs text-brand-primary/50">{{ product().category.name }}</p>

    <!-- Tranche d'âge -->
    <div class="flex items-center gap-1.5 text-xs text-brand-accent font-medium">
      <span>👶</span>
      <span>{{ product().ageRange }}</span>
    </div>

    <!-- Prix et stock -->
    <div class="mt-auto flex items-center justify-between pt-3 border-t border-slate-100">
      <span class="text-base font-bold text-brand-primary">{{ product().price | number:'1.2-2' }} Fcfa</span>
      @if (product().stockQuantity === 0) {
        <span class="text-xs font-medium text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">Rupture</span>
      } @else {
        <span class="text-xs text-brand-primary/40">{{ product().stockQuantity }} en stock</span>
      }
    </div>
  </div>

  <!-- Bouton ajouter -->
  <button
    type="button"
    (click)="addToCart($event)"
    [disabled]="product().stockQuantity === 0"
    class="mx-4 mb-4 rounded-xl bg-brand-secondary px-4 py-2.5 text-xs font-semibold text-white
           transition-all hover:bg-brand-primary disabled:opacity-40 disabled:cursor-not-allowed
           shadow-sm hover:shadow-md active:scale-[0.98]"
  >
    @if (product().stockQuantity === 0) {
      Indisponible
    } @else {
      Ajouter au panier
    }
  </button>
</a>
