<header class="sticky top-0 z-50 bg-brand-cream/95 backdrop-blur border-b border-black/20">
  <nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- Passage en flex pour un meilleur contrôle responsive -->
    <div class="flex justify-between items-center h-16">
      
      <!-- Gauche : Logo -->
      <a class="flex items-center gap-2.5 text-decoration-none" routerLink="/">
        <img
          src="https://res.cloudinary.com/piangwnw/image/upload/v1788607268/logo-rema.jpg"
          alt="Logo Réma Baby Crochet — fleur au crochet"
          class="h-12 w-12 rounded-full object-cover border-2 border-amber-500 shadow-sm"
        />
        <span class="flex flex-col leading-none">
          <span class="font-script text-3xl text-brand-primary font-bold">Réma</span>
          <span class="mt-0.5 text-[10px] font-extrabold tracking-[0.34em] uppercase text-brand-secondary">
            Baby Crochet
          </span>
        </span>
      </a>

      <!-- Centre : Liens (Visible uniquement sur desktop) -->
      <div class="hidden md:flex items-center gap-8">
        <a
          routerLink="/products"
          class="text-sm font-bold text-brand-primary hover:text-[#B8863C] border-b-2 border-transparent hover:border-[#B8863C] pb-0.5 transition cursor-pointer"
        >
          Collections
        </a>
        <a
          routerLink="/sur-mesure"
          class="text-sm font-bold text-brand-primary hover:text-[#B8863C] border-b-2 border-transparent hover:border-[#B8863C] pb-0.5 transition cursor-pointer"
        >
          Sur Mesure
        </a>
        <a
          routerLink="/a-propos"
          class="text-sm font-bold text-brand-primary hover:text-[#B8863C] border-b-2 border-transparent hover:border-[#B8863C] pb-0.5 transition cursor-pointer"
        >
          À propos
        </a>
      </div>

      <!-- Droite : Actions (Panier + Auth + Menu Mobile) -->
      <div class="flex items-center gap-3">
        <!-- Bouton Panier -->
        <button
          routerLink="/cart"
          type="button"
          class="relative inline-flex items-center gap-2 rounded-full border border-black/10 px-4 py-2 text-sm font-medium text-gray-800 hover:border-[#B8863C]/40 hover:text-[#B8863C] transition"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <!-- Masqué sur très petits écrans pour gagner de la place -->
          <span class="hidden sm:inline">Panier</span>
          <span
            class="absolute -top-2 -right-2 inline-flex items-center justify-center h-5 min-w-5 rounded-full bg-[#B8863C] text-white text-xs px-1"
          >
            {{ itemCount() }}
          </span>
        </button>

        <!-- Auth Desktop -->
        @if (auth.isAdmin()) {
          <div class="hidden sm:flex items-center gap-2">
            <span class="text-xs text-brand-primary/60 font-bold">Admin</span>
            <button (click)="auth.logout()" class="text-sm font-medium text-gray-800 hover:text-[#B8863C] transition">Déconnexion</button>
          </div>
        } @else {
          <a routerLink="/login" class="hidden sm:block text-sm font-medium text-gray-800 hover:text-[#B8863C] transition">Connexion</a>
        }

        <!-- Bouton Menu Mobile (Hamburger) -->
        <button 
          (click)="toggleMobileMenu()" 
          class="md:hidden p-2 text-brand-primary hover:text-[#B8863C] transition"
          aria-label="Ouvrir le menu"
        >
          @if (!isMobileMenuOpen) {
            <!-- Icône Hamburger -->
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <!-- Icône Croix (Fermer) -->
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Menu Déroulant Mobile -->
    @if (isMobileMenuOpen) {
      <div class="md:hidden border-t border-black/10 bg-brand-cream/95 backdrop-blur">
        <div class="px-4 py-4 space-y-4">
          <a
            routerLink="/products"
            (click)="closeMobileMenu()"
            class="block text-base font-bold text-brand-primary hover:text-[#B8863C] transition"
          >
            Collections
          </a>
          <a
            routerLink="/sur-mesure"
            (click)="closeMobileMenu()"
            class="block text-base font-bold text-brand-primary hover:text-[#B8863C] transition"
          >
            Sur Mesure
          </a>
          <a
            routerLink="/a-propos"
            (click)="closeMobileMenu()"
            class="block text-base font-bold text-brand-primary hover:text-[#B8863C] transition"
          >
            À propos
          </a>
          
          <!-- Séparateur et options Auth pour mobile -->
          <div class="pt-4 border-t border-black/10 flex flex-col gap-3">
            @if (auth.isAdmin()) {
              <span class="text-xs text-brand-primary/60 font-bold">Mode Administrateur</span>
              <button (click)="auth.logout(); closeMobileMenu()" class="text-left text-base font-medium text-gray-800 hover:text-[#B8863C] transition">
                Déconnexion
              </button>
            } @else {
              <a routerLink="/login" (click)="closeMobileMenu()" class="text-base font-medium text-gray-800 hover:text-[#B8863C] transition">
                Connexion
              </a>
            }
          </div>
        </div>
      </div>
    }
  </nav>
</header>
