@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-brand-primary/40 backdrop-blur-sm p-4 animate-fade-in">
    <div class="w-full max-w-sm animate-slide-up rounded-2xl bg-white p-6 shadow-xl ring-1 ring-slate-200/60">
      <div class="flex items-start gap-4">
        <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-xl bg-rose-50 text-lg">
          ⚠️
        </div>
        <div class="flex-1">
          <h3 class="text-base font-bold text-brand-primary">{{ title() }}</h3>
          <p class="mt-1 text-sm text-brand-primary/60">{{ message() }}</p>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          class="rounded-xl border-2 border-slate-200 px-4 py-2.5 text-sm font-semibold text-brand-primary/60 hover:bg-slate-50 transition"
          (click)="cancelled.emit()"
        >
          Annuler
        </button>
        <button
          type="button"
          class="rounded-xl bg-rose-500 px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-rose-600 transition"
          (click)="confirmed.emit()"
        >
          Confirmer
        </button>
      </div>
    </div>
  </div>
}
